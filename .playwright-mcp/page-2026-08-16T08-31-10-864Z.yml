      - generic [ref=f6e156]:
        - heading "API 제휴 신청" [level=2] [ref=f6e158]
        - list [ref=f6e159]:
          - listitem [ref=f6e160]:
            - generic [ref=f6e161]: 제휴신청
        - generic [ref=f6e162]:
          - paragraph [ref=f6e163]: 아래 API들은 개발자센터 API 제휴신청을 받지 않습니다.
          - list [ref=f6e164]:
            - listitem [ref=f6e165]: "-대상: 검색, 캡차(음성), 캡차(이미지), Papago 번역, 한글인명로마자 변환, 지도(웹), 지도(모바일)"
            - listitem [ref=f6e166]:
              - text: "-캡차(음성), 캡차(이미지), Papago 번역은 Ncloud에서 유료 API 이용 신청을 해주시길 바랍니다. (바로가기:"
              - link "https://www.ncloud.com/product/aiService" [ref=f6e167] [cursor=pointer]:
                - /url: https://www.ncloud.com/product/aiService
              - text: )
            - listitem [ref=f6e168]:
              - text: "-검색 API와 한글인명로마자 변환 신규 제휴는 받지 않습니다. 별도의 사업적 제안이 있다면 네이버 제휴제안으로 신청해주시길 바라며, 제안 내용에 따라 거절될 수도 있습니다. (바로가기:"
              - link "https://www.navercorp.com/ko/company/proposalGuide.nhn" [ref=f6e169] [cursor=pointer]:
                - /url: https://www.navercorp.com/ko/company/proposalGuide.nhn
              - text: )
            - listitem [ref=f6e170]:
              - text: "-지도 API를 기본 한도 이상 사용하시길 희망하는 경우는 Ncloud Maps API를 이용해 주시길 바랍니다. (바로가기:"
              - link "https://www.ncloud.com/product/applicationService/maps" [ref=f6e171] [cursor=pointer]:
                - /url: https://www.ncloud.com/product/applicationService/maps
              - text: )
          - paragraph [ref=f6e172]: 제휴신청은 API를 일 호출 허용량 이상으로 사업적으로 사용하기 위해 API 사용량, API 사용처, API 활용목적에 대해 검토를 받는 절차이며 API 사용처, 활용 목적에 따라 제휴승인이 거절될 수 있습니다.
          - paragraph [ref=f6e173]: 1. 제휴 신청이 필요한 경우
          - list [ref=f6e174]:
            - listitem [ref=f6e175]:
              - text: "-제휴 신청 대상 API는 일 쿼리 사용량 제한이 있는 API들에 대해 신청가능하며, 그 외에 API 활용 관련해서 사업적으로 파트너십을 희망하실 경우는"
              - link "네이버 제휴제안" [ref=f6e176] [cursor=pointer]:
                - /url: https://www.navercorp.com/ko/company/proposalGuide.nhn
              - text: 으로 문의 부탁드립니다.
            - listitem [ref=f6e177]: "-애플리케이션에 적용한 네이버 오픈 API의 일 기준 쿼리량이 한도 초과 또는 초과 예상될 경우에만 신청해주세요."
          - paragraph [ref=f6e178]: 2. 제휴 신청 반려 사유
          - list [ref=f6e179]:
            - listitem [ref=f6e180]: "-실제 서비스에 반영된 API 사용량이 일 허용량 한도 이내인 경우"
            - listitem [ref=f6e181]: "-API를 테스트 또는 학습의 목적으로 사용하는 경우"
            - listitem [ref=f6e182]: "-애플리케이션 정보에 기재된 API 사용처가 실제 서비스와 일치하지 않는 경우"
            - listitem [ref=f6e183]:
              - text: "-API 용도가 실제 서비스와 다르거나"
              - link "약관" [ref=f6e184] [cursor=pointer]:
                - /url: https://developers.naver.com/products/intro/terms/terms.md
              - text: 상 허용하지 않는 목적으로 사용하는 경우
            - listitem [ref=f6e185]: "-API 결과 데이터의 추출 및 저장 목적"
            - listitem [ref=f6e186]:
              - text: "-"
              - link "BI 가이드" [ref=f6e187] [cursor=pointer]:
                - /url: https://developers.naver.com/products/intro/bi_guide/bi_guide.md
              - text: 미준수
          - paragraph [ref=f6e188]: 3. 주의사항
          - list [ref=f6e189]:
            - listitem [ref=f6e190]:
              - text: "-제휴 신청 전에 애플리케이션을 먼저 등록해주세요."
              - link "애플리케이션 등록하기 안내 >" [ref=f6e191] [cursor=pointer]:
                - /url: http://developers.naver.com/docs/common/register
            - listitem [ref=f6e192]: "-지도 API는 웹, 모바일 별도로 제휴 신청을 받습니다."
            - listitem [ref=f6e193]: "-API 용도는 명확하게 설명해주시길 바라며 API 용도가 불명확하면 반려됩니다."
            - listitem [ref=f6e194]: "-API 활용화면은 실제 애플리케이션 화면을 캡쳐해주셔야 원활한 검토가 가능합니다."
            - listitem [ref=f6e195]: "-제휴 신청 진행 사항은 '진행 조회'에서 확인 가능하며, 통상 1~2주 정도 소요됩니다. 추가적인 문의는 dl_naver_openapi @ navercorp.com 으로 보내주시길 바랍니다."
